<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My First Web</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        overflow-x: hidden;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 30% 30%, #3a0000, #000000 60%),
                    linear-gradient(-45deg, #000000, #4d0000, #1a0000, #660000);
        background-size: 300% 300%, 400% 400%;
        animation: gradientBG 18s ease infinite;
        padding: 20px;
        position: relative;
        overflow: hidden;
        color: #fff;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%, 0% 50%; }
        50% { background-position: 100% 50%, 100% 50%; }
        100% { background-position: 0% 50%, 0% 50%; }
    }

    /* Floating embers */
    .ember {
        position: fixed;
        bottom: -20px;
        border-radius: 50%;
        background: radial-gradient(circle, #ff8a00, #ff2b00, transparent 70%);
        opacity: 0.8;
        pointer-events: none;
        z-index: 0;
        filter: blur(1px);
        animation: riseUp linear infinite;
    }

    @keyframes riseUp {
        0% {
            transform: translateY(0) translateX(0) scale(1);
            opacity: 0.9;
        }
        100% {
            transform: translateY(-110vh) translateX(var(--drift)) scale(0.3);
            opacity: 0;
        }
    }

    .container {
        position: relative;
        z-index: 1;
        background: rgba(20, 0, 0, 0.5);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-radius: 20px;
        border: 1px solid rgba(255, 60, 0, 0.25);
        padding: 50px 40px;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 0 40px rgba(255, 40, 0, 0.25), 0 8px 32px rgba(0,0,0,0.6);
        text-align: center;
        animation: fadeInUp 1s ease-out;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1.title {
        font-size: 2.8rem;
        background: linear-gradient(90deg, #ff5e00, #ff0000, #ff9d00);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 4px 25px rgba(255,60,0,0.4);
        margin-bottom: 15px;
        letter-spacing: 1px;
    }

    .subtitle {
        font-size: 1.1rem;
        color: rgba(255, 220, 200, 0.8);
        margin-bottom: 35px;
        line-height: 1.6;
    }

    ul.feature-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    ul.feature-list li {
        background: rgba(255, 60, 0, 0.08);
        padding: 18px 25px;
        border-radius: 12px;
        color: #fff;
        font-size: 1.1rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: all 0.3s ease;
        border: 1px solid rgba(255, 80, 0, 0.2);
        cursor: pointer;
        user-select: none;
    }

    ul.feature-list li:hover {
        background: rgba(255, 60, 0, 0.2);
        transform: translateX(10px) scale(1.02);
        box-shadow: 0 5px 25px rgba(255, 40, 0, 0.35);
        border-color: rgba(255, 100, 0, 0.5);
    }

    ul.feature-list li:active {
        transform: scale(0.97);
    }

    ul.feature-list li::before {
        content: "🔥";
        font-size: 1.3rem;
    }

    .footer-note {
        margin-top: 30px;
        font-size: 0.85rem;
        color: rgba(255, 180, 150, 0.5);
    }

    /* Modal */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: all 0.35s ease;
        z-index: 10;
    }

    .modal-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    .modal-box {
        background: linear-gradient(160deg, rgba(60,0,0,0.6), rgba(10,0,0,0.7));
        backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 80, 0, 0.35);
        border-radius: 18px;
        padding: 35px 30px;
        max-width: 440px;
        width: 90%;
        text-align: center;
        color: #fff;
        box-shadow: 0 0 60px rgba(255, 40, 0, 0.35), 0 10px 40px rgba(0,0,0,0.6);
        transform: scale(0.8);
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal-box {
        transform: scale(1);
    }

    .modal-icon {
        font-size: 3rem;
        margin-bottom: 15px;
        filter: drop-shadow(0 0 10px rgba(255,80,0,0.6));
    }

    .modal-title {
        font-size: 1.6rem;
        margin-bottom: 18px;
        font-weight: 700;
        background: linear-gradient(90deg, #ff5e00, #ff0000);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .modal-desc {
        font-size: 1rem;
        line-height: 1.7;
        color: rgba(255, 230, 220, 0.95);
        margin-bottom: 25px;
        min-height: 90px;
        text-align: left;
    }

    .modal-desc .char {
        opacity: 0;
        display: inline-block;
        filter: blur(4px);
        transform: translateY(6px);
        animation: revealChar 0.45s forwards;
    }

    @keyframes revealChar {
        to {
            opacity: 1;
            filter: blur(0);
            transform: translateY(0);
        }
    }

    .cursor {
        display: inline-block;
        width: 2px;
        height: 1em;
        background: #ff5e00;
        margin-left: 2px;
        vertical-align: middle;
        animation: blink 0.8s step-start infinite;
    }

    @keyframes blink {
        50% { opacity: 0; }
    }

    .modal-close {
        background: rgba(255, 60, 0, 0.15);
        border: 1px solid rgba(255, 80, 0, 0.5);
        color: #fff;
        padding: 10px 30px;
        border-radius: 30px;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.25s ease;
    }

    .modal-close:hover {
        background: rgba(255, 80, 0, 0.35);
        box-shadow: 0 0 20px rgba(255, 60, 0, 0.5);
        transform: translateY(-2px);
    }

    @media (max-width: 480px) {
        h1.title { font-size: 2rem; }
        .container { padding: 35px 25px; }
    }
</style>
</head>
<body>

    <div class="container">
        <h1 class="title"><i>My First Website!</i></h1>
        <p class="subtitle">This is my first website. I made it in VS Code 🚀<br>Click a feature below to learn more!</p>

        <ul class="feature-list">
            <li data-key="new">It is new</li>
            <li data-key="madeByMe">It is made by me</li>
            <li data-key="test">It is made for testing</li>
        </ul>

        <p class="footer-note">Built with 🔥 using HTML, CSS & JavaScript</p>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-icon" id="modalIcon">🔥</div>
            <div class="modal-title" id="modalTitle">Title</div>
            <div class="modal-desc" id="modalDesc"></div>
            <button class="modal-close" id="modalClose">Close</button>
        </div>
    </div>

<script>
    /* ---------------- Sound Effects (Web Audio API, no files needed) ---------------- */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone({freq = 440, duration = 0.1, type = 'sine', volume = 0.15, freqEnd = null}) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (freqEnd) {
            osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
        }
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function playClickSound() {
        playTone({ freq: 300, freqEnd: 700, duration: 0.15, type: 'triangle', volume: 0.18 });
    }

    function playWhooshSound() {
        playTone({ freq: 900, freqEnd: 100, duration: 0.35, type: 'sawtooth', volume: 0.1 });
    }

    function playTypeTick() {
        playTone({ freq: 1200 + Math.random()*300, duration: 0.03, type: 'square', volume: 0.04 });
    }

    function playCloseSound() {
        playTone({ freq: 500, freqEnd: 150, duration: 0.25, type: 'sine', volume: 0.15 });
    }

    /* ---------------- Floating Embers ---------------- */
    const emberCount = 25;
    for (let i = 0; i < emberCount; i++) {
        const ember = document.createElement('div');
        ember.classList.add('ember');
        const size = Math.random() * 6 + 3;
        ember.style.width = `${size}px`;
        ember.style.height = `${size}px`;
        ember.style.left = `${Math.random() * 100}vw`;
        ember.style.setProperty('--drift', `${(Math.random() - 0.5) * 200}px`);
        const duration = Math.random() * 6 + 6;
        ember.style.animationDuration = `${duration}s`;
        ember.style.animationDelay = `${Math.random() * 8}s`;
        document.body.appendChild(ember);
    }

    /* ---------------- Feature Data ---------------- */
    const infoData = {
        new: {
            icon: "🆕",
            title: "It is new",
            desc: "This website was just created! It represents a fresh start into the world of web development, built from scratch using pure HTML, CSS, and JavaScript."
        },
        madeByMe: {
            icon: "🙋‍♂️",
            title: "It is made by me",
            desc: "Every line of code here was written by hand — no templates, no shortcuts. This is a personal project made to practice and showcase coding skills."
        },
        test: {
            icon: "🧪",
            title: "It is made for testing",
            desc: "This site serves as a testing ground for experimenting with layouts, animations, and interactive features before building bigger projects."
        }
    };

    const listItems = document.querySelectorAll('.feature-list li');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalIcon = document.getElementById('modalIcon');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const modalClose = document.getElementById('modalClose');

    let typingTimeout;

    function typeText(text) {
        modalDesc.innerHTML = '';
        clearTimeout(typingTimeout);

        const cursor = document.createElement('span');
        cursor.classList.add('cursor');

        let i = 0;
        function typeChar() {
            if (i < text.length) {
                const span = document.createElement('span');
                span.classList.add('char');
                span.textContent = text[i] === ' ' ? '\u00A0' : text[i];
                span.style.animationDelay = '0s';
                modalDesc.insertBefore(span, cursor);

                if (i % 2 === 0) playTypeTick(); // subtle tick every 2 chars

                i++;
                typingTimeout = setTimeout(typeChar, 22); // smooth Apple-like pace
            } else {
                setTimeout(() => cursor.remove(), 1200);
            }
        }
        modalDesc.appendChild(cursor);
        typeChar();
    }

    listItems.forEach(item => {
        item.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            playClickSound();
            setTimeout(playWhooshSound, 80);

            const key = item.getAttribute('data-key');
            const data = infoData[key];
            if (data) {
                modalIcon.textContent = data.icon;
                modalTitle.textContent = data.title;
                modalOverlay.classList.add('active');
                typeText(data.desc);
            }
        });
    });

    function closeModal() {
        playCloseSound();
        modalOverlay.classList.remove('active');
        clearTimeout(typingTimeout);
    }

    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape") closeModal();
    });
</script>
</body>
</html>
